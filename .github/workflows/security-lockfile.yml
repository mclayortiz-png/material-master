# Prepara exclusivamente o lockfile na branch privada de seguranca.
# Nao faz merge, deploy, nem acessa banco de dados.
name: "Preparar lockfile de seguranca"
on:
  push:
    branches: ["security/corrigir-dependencias-pit-ii"]
    paths:
      - ".github/workflows/security-lockfile.yml"
      - "situacao-2-desenvolvimento/codigo-fonte/nextjs_space/package.json"
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: situacao-2-desenvolvimento/codigo-fonte/nextjs_space
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Preparar Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.4 --activate
      - name: Sincronizar lockfile e atualizar dependencias transitivas
        run: |
          yarn install --mode=skip-build
          yarn up -R fast-xml-parser
          yarn up -R minimatch
          yarn install --immutable
      - name: Registrar somente lockfile revisado nesta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock package.json
          if ! git diff --cached --quiet; then
            git commit -m "security: sincronizar yarn.lock com dependencias corrigidas"
            git push origin "HEAD:security/corrigir-dependencias-pit-ii"
          fi
      - name: Validar versoes resolvidas
        run: |
          yarn why csv-parse
          yarn why minimatch
          yarn why fast-xml-parser
          yarn why webpack
